# Builds the BMX Logger Android app (APK) on every push to main, or by hand from the Actions tab.
# The APK is published as a GitHub Release: open Releases on the phone and tap bmx-logger.apk.
name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to save the signing key once and to publish the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # One signing key for every build, so a new APK installs over the old one.
      # The first run creates it and saves it in the repository.
      - name: Signing key
        run: |
          KS=android_app/keystore/debug.keystore
          if [ ! -f "$KS" ]; then
            mkdir -p android_app/keystore
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add "$KS"
            git commit -m "Save app signing key [skip ci]"
            git push
          fi
          mkdir -p ~/.android
          cp "$KS" ~/.android/debug.keystore

      - name: Build the app files
        working-directory: android_app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Create the Android project
        working-directory: android_app
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      # Keep Gradle and its downloads between builds, so a download outage can't stop a build
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
          key: gradle-${{ hashFiles('android_app/package.json') }}
          restore-keys: gradle-

      - name: Build the APK
        working-directory: android_app/android
        run: |
          # retry: downloads (Gradle, Maven) occasionally fail for a minute
          for i in 1 2 3 4 5; do
            ./gradlew assembleDebug --no-daemon --stacktrace && exit 0
            echo "Build attempt $i failed, retrying in 60 s"; sleep 60
          done
          exit 1

      - name: Name the APK
        run: cp android_app/android/app/build/outputs/apk/debug/app-debug.apk bmx-logger.apk

      - uses: actions/upload-artifact@v7
        with:
          name: bmx-logger-apk
          path: bmx-logger.apk

      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" bmx-logger.apk \
            --title "BMX Logger build ${{ github.run_number }}" \
            --notes "Install bmx-logger.apk on the phone. Built from ${{ github.sha }}." \
            --latest
